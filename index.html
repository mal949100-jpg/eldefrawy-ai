<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eldefrawy AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a2332;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #111827;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border-bottom: 1px solid #374151;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 10px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #0284c7;
            align-self: flex-end;
        }
        .ai-message {
            background-color: #374151;
            align-self: flex-start;
        }
        #input-container {
            display: flex;
            padding: 15px;
            background-color: #111827;
            border-top: 1px solid #374151;
        }
        #user-input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #4b5563;
            background-color: #1f2937;
            color: white;
            font-size: 16px;
            outline: none;
        }
        #send-btn {
            background-color: #0ea5e9;
            color: white;
            border: none;
            padding: 0 20px;
            margin-right: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        #send-btn:hover {
            background-color: #0284c7;
        }
    </style>
</head>
<body>

    <header>Eldefrawy AI</header>

    <div id="chat-container">
        <div class="message ai-message">أهلاً بك يا فنان! أنا جاهز أرد عليك، اكتب لي سؤالك.</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." />
        <button id="send-btn" onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatContainer = document.getElementById('chat-container');
            const messageText = inputField.value.trim();

            if (!messageText) return;

            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user-message';
            userMsgDiv.textContent = messageText;
            chatContainer.appendChild(userMsgDiv);

            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai-message';
            aiMsgDiv.textContent = 'جاري التفكير...';
            chatContainer.appendChild(aiMsgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer ",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"
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{ role: "user", content: messageText }]
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    aiMsgDiv.textContent = data.choices[0]?.message?.content || "عذراً، لم أستطع الرد.";
                } else {
                    aiMsgDiv.textContent = 'خطأ: ' + (data.error?.message || 'مشكلة في الاتصال');
                }
            } catch (error) {
                aiMsgDiv.textContent = 'خطأ في الشبكة يا غالي.';
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
