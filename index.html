<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eldefrawy AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 15px;
    }
    header {
      text-align: center;
      padding: 10px;
      font-size: 1.5rem;
      font-weight: bold;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 10px;
      color: #38bdf8;
    }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #1e293b;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 15px;
    }
    .msg {
      padding: 12px 16px;
      border-radius: 10px;
      max-width: 75%;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .user {
      background: #0284c7;
      color: white;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }
    .bot {
      background: #334155;
      color: #f1f5f9;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }
    .input-area {
      display: flex;
      gap: 10px;
    }
    input {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    input:focus {
      border-color: #38bdf8;
    }
    button {
      padding: 0 24px;
      border-radius: 10px;
      border: none;
      background: #0284c7;
      color: white;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      transition: background 0.2s;
    }
    button:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>

  <header>Eldefrawy AI</header>

  <div id="chat-box">
    <div class="msg bot">أهلاً بك! أنا مساعدك الذكي، كيف يمكنني مساعدتك اليوم؟</div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." onkeydown="if(event.key==='Enter') sendMsg()"/>
    <button onclick="sendMsg()">إرسال</button>
  </div>

  <script>
    async function sendMsg() {
      const input = document.getElementById('userInput');
      const box = document.getElementById('chat-box');
      const text = input.value.trim();
      if (!text) return;

      // إضافة رسالة المستخدم
      box.innerHTML += `<div class="msg user">${escapeHtml(text)}</div>`;
      input.value = '';
      box.scrollTop = box.scrollHeight;

      // رسالة جاري التفكير
      const loadingId = 'loading-' + Date.now();
      box.innerHTML += `<div id="${loadingId}" class="msg bot">جاري التفكير...</div>`;
      box.scrollTop = box.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });
        
        const data = await res.json();
        const loadingDiv = document.getElementById(loadingId);
        
        if (res.ok) {
          loadingDiv.innerText = data.text || 'لم يتم استلام رد.';
        } else {
          loadingDiv.innerText = 'خطأ: ' + (data.error || 'حدث مشكلة في الخادم');
        }
      } catch (e) {
        document.getElementById(loadingId).innerText = 'خطأ في الاتصال بالشبكة.';
      }
      box.scrollTop = box.scrollHeight;
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
